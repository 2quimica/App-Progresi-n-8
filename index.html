<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Progresión 8: Conservación y Transferencia de Energía en Campos y Sistemas</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --border-color: #263554;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.25);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.25);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.2);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Fixed Top Navigation Bar */
    .top-bar {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: rgba(19, 27, 46, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .top-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .phase-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      background-color: #0b111e;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.4s ease;
    }

    /* Standard Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header-badge {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan-glow);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    strong {
      color: var(--text-main);
    }

    /* Teacher Pause Box */
    .teacher-pause-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(139, 92, 246, 0.12));
      border: 2px dashed var(--accent-amber);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .teacher-pause-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-amber);
    }

    /* Form Inputs & Buttons */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--accent-cyan-glow);
    }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      user-select: none;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-cyan-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #18233c;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-cyan);
    }

    .btn-secondary.selected {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.15);
      color: #fff;
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--accent-amber), #d97706);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-amber-glow);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Interactive Simulations Layout */
    .sim-container {
      background-color: #0b101d;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sim-canvas-box {
      width: 100%;
      min-height: 200px;
      background-color: #060911;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .slider-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #131a2a;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .slider-control label {
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      color: var(--accent-cyan);
    }

    .slider-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .value-display {
      font-weight: 800;
      color: var(--text-main);
    }

    /* Options & Quiz Buttons */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(.btn-disabled) {
      border-color: var(--accent-cyan);
      background-color: var(--bg-card-hover);
    }

    .option-btn.selected {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.12);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: var(--border-color);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .feedback-correct {
      background-color: var(--success-bg);
      border: 1.5px solid var(--success);
      color: #6ee7b7;
    }

    .feedback-incorrect {
      background-color: var(--danger-bg);
      border: 1.5px solid var(--danger);
      color: #fca5a5;
    }

    /* Concept Map Touch Interactive */
    .map-nodes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .map-nodes-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .map-node {
      background-color: #0b101d;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-node-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .map-slot {
      min-height: 42px;
      border: 1.5px dashed var(--accent-cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--accent-cyan);
      cursor: pointer;
      background-color: rgba(6, 182, 212, 0.04);
      padding: 6px 10px;
      text-align: center;
    }

    .map-slot.filled {
      border-style: solid;
      background-color: #1e2c4a;
      color: #fff;
    }

    /* Quiz Navigator Grid */
    .quiz-nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .quiz-nav-btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-nav-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }

    .quiz-nav-btn.answered {
      background-color: #1e2c4a;
      color: #fff;
      border-color: var(--accent-purple);
    }

    /* Evidence Screenshot Card */
    .evidence-card {
      background: linear-gradient(180deg, #131b2e 0%, #080d1a 100%);
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .score-large {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-perf {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      align-self: center;
    }

    .badge-exc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-good { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid #06b6d4; }
    .badge-proc { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-reinf { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    .summary-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-table td:nth-child(2) {
      text-align: right;
      font-weight: 700;
      color: var(--text-main);
    }

    .camera-notice {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
      border: 1.5px dashed var(--accent-amber);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #fef08a;
    }

    /* Flashcard Stack */
    .flashcard {
      background: #0b101d;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .flashcard-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Top Progress Bar (Visible after Start) -->
    <div id="top-bar" class="top-bar" style="display: none;">
      <div class="top-bar-header">
        <span id="user-display-tag" class="user-tag">Estudiante</span>
        <span id="phase-display-badge" class="phase-badge">FASE 1 DE 5</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Main Dynamic Content Container -->
    <main id="app-content"></main>
  </div>

  <script>
    // --- GLOBAL QUIZ BANK FOR PROGRESIÓN 8 (10 QUESTIONS) ---
    const QUIZ_BANK = [
      {
        id: 1,
        topic: "conservacion",
        question: "¿Qué establece el principio fundamental de Conservación de la Energía en los procesos de la física?",
        options: [
          "Que la energía se destruye gradualmente a medida que un objeto disminuye su velocidad.",
          "Que la energía no se crea ni se destruye; únicamente se transfiere o transforma entre objetos, campos y sistemas.",
          "Que la energía solo existe cuando hay materia sólida en contacto físico directo.",
          "Que la cantidad total de energía de un sistema abierto siempre aumenta de forma espontánea."
        ],
        correct: 1,
        explanation: "La ley universal de conservación establece que la energía total permanece constante: solo se transfiere entre objetos, campos de fuerza o componentes de un sistema."
      },
      {
        id: 2,
        topic: "campos_energia",
        question: "¿Dónde se almacena la energía potencial en un sistema interactuante sin contacto como un capacitor o un imán?",
        options: [
          "Exclusivamente en los átomos internos de la batería exterior.",
          "En la masa inerte del aire que rodea a los cables.",
          "En el propio campo de fuerza (eléctrico o magnético) presente en la región del espacio entre los objetos.",
          "La energía desaparece momentáneamente hasta que los objetos se tocan."
        ],
        correct: 2,
        explanation: "Los campos eléctricos y magnéticos no son meras construcciones abstractas: albergan y transmiten energía real en el espacio que rodea a las cargas o fuentes magnéticas."
      },
      {
        id: 3,
        topic: "lineas_densidad",
        question: "En una representación con líneas de campo, ¿qué información proporciona la DENSIDAD de las líneas (qué tan juntas están)?",
        options: [
          "A mayor densidad de líneas, el campo es más intenso y mayor es la energía almacenada en esa región.",
          "La densidad indica la velocidad a la que viajan las partículas de masa alrededor del objeto.",
          "A mayor densidad de líneas, el campo es más débil y almacena menos energía.",
          "Indica que las líneas son hilos materiales sólidos que tiran del objeto de prueba."
        ],
        correct: 0,
        explanation: "En los modelos de campos, la mayor concentración o densidad de líneas por unidad de área representa un campo de mayor magnitud/intensidad y una mayor densidad de energía almacenada."
      },
      {
        id: 4,
        topic: "relacion_fuerza",
        question: "¿Cuál es la relación entre la magnitud del campo en un punto y la fuerza ejercida sobre una carga o masa de prueba?",
        options: [
          "No existe ninguna relación; la fuerza es totalmente independiente del campo.",
          "Donde el campo es más intenso, el objeto de prueba experimentará una fuerza mayor y seguirá la trayectoria marcada por las líneas.",
          "La fuerza es inversamente proporcional al cuadrado del número de partículas neutrales.",
          "La fuerza solo aparece si el campo eléctrico y el magnético tienen la misma frecuencia en Hz."
        ],
        correct: 1,
        explanation: "El campo cuantifica la capacidad del espacio para ejercer fuerza sobre un objeto de prueba ($F = qE$). A mayor intensidad de campo, mayor es la fuerza resultante."
      },
      {
        id: 5,
        topic: "dispositivos",
        question: "¿En qué región de un solenoide (bobina de alambre con corriente) o de un capacitor de placas paralelas la energía almacenada es mayor?",
        options: [
          "En el exterior muy lejano, donde las líneas de campo se dispersan.",
          "En el interior de la bobina o entre las placas del capacitor, donde las líneas de campo son más compactas y densas.",
          "Únicamente en el interruptor de plástico cuando está apagado.",
          "En los cables de conexión neutros no conductores."
        ],
        correct: 1,
        explanation: "Tanto en el interior de un solenoide como entre las placas paralelas de un capacitor, las líneas de campo se concentran de forma muy uniforme y densa, indicando la máxima acumulación de energía."
      },
      {
        id: 6,
        topic: "diferencias_campos",
        question: "¿Cuál es una diferencia fundamental entre las fuentes del campo eléctrico y del campo magnético?",
        options: [
          "Existen cargas eléctricas individuales (monopolos +, -), mientras que los polos magnéticos siempre existen en pares (dipolos N-S).",
          "El campo eléctrico no ejerce fuerzas a distancia, mientras que el magnético sí.",
          "El campo magnético no almacena energía, mientras que el eléctrico sí.",
          "Las líneas de campo eléctrico forman siempre bucles cerrados y las magnéticas parten del infinito."
        ],
        correct: 0,
        explanation: "Podemos aislar una carga positiva o negativa individual (monopolo eléctrico), pero si cortamos un imán por la mitad, obtenemos dos nuevos imanes con polos Norte y Sur (dipolos)."
      },
      {
        id: 7,
        topic: "transferencia_sistemas",
        question: "Cuando un motor eléctrico funciona, ¿cómo ocurre la transferencia de energía entre campos y objetos?",
        options: [
          "La energía eléctrica almacenada en la fuente genera un campo magnético que interactúa ejerciendo fuerzas mecánicas para rotar el eje del motor.",
          "La energía del motor se crea espontáneamente sin consumir energía eléctrica.",
          "Los electrones se transforman en calor hasta desaparecer totalmente del circuito.",
          "La gravedad destruye el campo eléctrico de las bobinas de cobre."
        ],
        correct: 0,
        explanation: "Un motor eléctrico convierte la energía de la corriente en campos magnéticos cambiantes, los cuales ejercen fuerzas sobre el rotor transformando la energía de campo en energía cinética mecánica."
      },
      {
        id: 8,
        topic: "naturaleza_lineas",
        question: "¿Cómo deben entenderse científicamente las 'líneas de campo' utilizadas en física?",
        options: [
          "Son cables de cobre microscópicos que se extienden físicamente por el espacio.",
          "Son representaciones visuales y modelos conceptuales para interpretar la dirección, sentido e intensidad del campo.",
          "Son rayos de luz visible emitidos por cargas neutras.",
          "Son cadenas de átomos de hierro que flotan en el vacío de forma permanente."
        ],
        correct: 1,
        explanation: "Las líneas de campo son modelos pictóricos e instrumentos conceptuales creados por científicos como Michael Faraday para visualizar e interpretar los campos de fuerza invisibles."
      },
      {
        id: 9,
        topic: "wimshurst_experimento",
        question: "En la experiencia con la máquina de Wimshurst y aceite con fibra de algodón, ¿qué provocó que las fibras se alinearan formando patrones?",
        options: [
          "El calor del aire hirviendo la mezcla de aceite.",
          "La presencia de campos magnéticos permanentes en las partículas de plástico.",
          "El campo eléctrico generado por los conductores cargados orientó y alineó las partículas a lo largo de las líneas de campo.",
          "La gravedad terrestre empujó las fibras hacia los bordes del frasco."
        ],
        correct: 2,
        explanation: "Al cargarse los conductores con la máquina de Wimshurst, el intenso campo eléctrico en la mezcla líquida polariza y alinea la fibra de algodón revelando empíricamente la forma de las líneas de campo."
      },
      {
        id: 10,
        topic: "modelos_relatividad",
        question: "En la extensión sobre la evolución de los modelos científicos (Gravity Probe B), ¿qué se buscó verificar experimentalmente sobre el espacio-tiempo?",
        options: [

          </button>
        </div>
      `;
    }

    function saveReflection(val) {
      state.evaluate.reflection = val;
      saveState();
    }

    function toggleAnswerReview() {
      const box = document.getElementById('answers-review-box');
      if (box) {
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function resetQuizSession() {
      if (confirm("¿Deseas reiniciar la aplicación para otro estudiante?")) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch(e) {}
        state.user = { name: '', group: '' };
        state.phase = 0;
        state.screen = 'START';
        state.evaluate.answers = new Array(10).fill(null);
        state.evaluate.submitted = false;
        renderApp();
      }
    }

    // General Navigation Helper
    function goToPhase(phaseNum, screenName) {
      state.phase = phaseNum;
      state.screen = screenName;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- INITIALIZATION ON WINDOW LOAD ---
    window.onload = function() {
      loadState();
      renderApp();
    };
  </script>
</body>
</html>
